<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>This meeting could have been an email.</title>
<meta name="description" content="It still can be.">
<meta property="og:title" content="This meeting could have been an email.">
<meta property="og:description" content="It still can be.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://meetingcouldhavebeenan.email">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="This meeting could have been an email.">
<meta name="twitter:description" content="It still can be.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>.</text></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f5f0eb;
  --surface: #fffcf8;
  --border: #e0d8cf;
  --border-light: #ece6de;
  --text: #3a3530;
  --text-soft: #8a8078;
  --text-faint: #b5ada5;
  --accent: #2a6e4e;
  --accent-hover: #358a62;
  --placeholder: #c0b8b0;
  --field-bg: #faf6f1;
  --red: #c06050;
  --label-accent: #7a6850;
  --focus: #2a6e4e;
}

[data-theme="dark"] {
  --bg: #1a1816;
  --surface: #242120;
  --border: #3a3530;
  --border-light: #2e2a28;
  --text: #e0d8cf;
  --text-soft: #8a8078;
  --text-faint: #5a534a;
  --accent: #4a9e72;
  --accent-hover: #5db885;
  --placeholder: #5a534a;
  --field-bg: #1e1c1a;
  --red: #d08070;
  --label-accent: #a09080;
  --focus: #4a9e72;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.5rem;
}

/* everything that carries color transitions together */
body, .email-form, .field label, .field input, .field textarea,
.actions, button[type="submit"], h1, .theme-toggle, .tagline,
.note, .char-count {
  transition: background 0.5s ease, color 0.5s ease,
              border-color 0.5s ease, box-shadow 0.5s ease;
}

header {
  width: 100%;
  max-width: 36rem;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 2rem;
}

h1 {
  font-size: 1.6rem;
  font-weight: 400;
  color: var(--text-soft);
  letter-spacing: -0.01em;
}

.theme-toggle {
  background: none;
  border: none;
  color: var(--text-faint);
  cursor: pointer;
  font-size: 0.95rem;
  padding: 0.3rem 0;
  font-family: inherit;
  letter-spacing: 0.03em;
}

.theme-toggle:hover {
  color: var(--text-soft);
}

.email-form {
  width: 100%;
  max-width: 36rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}

.field {
  display: flex;
  border-bottom: 1px solid var(--border-light);
  transition: border-color 0.5s ease;
}

.field label {
  width: 6.5rem;
  flex-shrink: 0;
  padding: 1rem 1.1rem;
  font-size: 1.1rem;
  color: var(--label-accent);
  background: var(--field-bg);
  border-right: 1px solid var(--border-light);
  display: flex;
  align-items: flex-start;
}

.field input,
.field textarea {
  flex: 1;
  border: none;
  outline: none;
  padding: 1rem 1.1rem;
  font-family: inherit;
  font-size: 1.15rem;
  color: var(--text);
  background: transparent;
  resize: none;
  line-height: 1.5;
}

.field input:focus,
.field textarea:focus {
  box-shadow: inset 3px 0 0 var(--focus);
}

.field input::placeholder,
.field textarea::placeholder {
  color: var(--placeholder);
  transition: color 0.5s ease;
}

.body-field {
  flex-direction: column;
  border-bottom: none;
}

.body-field label {
  width: 100%;
  border-right: none;
  border-bottom: 1px solid var(--border-light);
  padding: 0.8rem 1.1rem;
  font-size: 1rem;
}

.body-field textarea {
  padding: 1rem 1.1rem;
  min-height: 7rem;
}

.actions {
  padding: 1rem 1.1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  border-top: 1px solid var(--border-light);
  background: var(--field-bg);
}

.char-count {
  font-size: 0.9rem;
  color: var(--text-faint);
}

button[type="submit"] {
  background: var(--border);
  color: var(--text-faint);
  border: none;
  padding: 0.7rem 2.2rem;
  border-radius: 5px;
  font-size: 1.1rem;
  cursor: default;
  font-family: inherit;
  transition: background 0.4s ease, color 0.4s ease, transform 0.15s ease;
}

button[type="submit"].ready {
  background: var(--accent);
  color: #fff;
  cursor: pointer;
}

button[type="submit"].ready:hover {
  background: var(--accent-hover);
}

button[type="submit"].ready:active {
  transform: scale(0.97);
}

footer {
  max-width: 36rem;
  width: 100%;
  margin-top: 2rem;
  text-align: center;
}

.tagline {
  font-size: 1.15rem;
  color: var(--text-soft);
  margin-bottom: 1rem;
}

.tagline.sent {
  color: var(--accent);
}

.note {
  font-size: 0.95rem;
  color: var(--text-faint);
  line-height: 1.6;
}

@media (max-width: 480px) {
  body { padding: 2rem 1rem; }
  header { margin-bottom: 1.5rem; }
  .field label { width: 5.5rem; padding: 0.8rem; font-size: 1rem; }
  .field input, .field textarea { padding: 0.8rem; font-size: 1.05rem; }
  .actions { padding: 0.8rem; }
  footer { margin-top: 1.5rem; }
}
</style>
</head>
<body>

<header>
  <h1>This meeting could have been an email.</h1>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">dark</button>
</header>

<form class="email-form" id="emailForm">
  <div class="field">
    <label for="to">To</label>
    <input type="text" id="to" placeholder="who needs to know" autocomplete="off">
  </div>
  <div class="field">
    <label for="subject">Subject</label>
    <input type="text" id="subject" placeholder="what this is about" autocomplete="off">
  </div>
  <div class="field">
    <label for="decided">Decided</label>
    <input type="text" id="decided" placeholder="what was decided" autocomplete="off">
  </div>
  <div class="field">
    <label for="action">Next step</label>
    <input type="text" id="action" placeholder="what needs to happen now" autocomplete="off">
  </div>
  <div class="field">
    <label for="by">By when</label>
    <input type="text" id="by" placeholder="deadline, if any" autocomplete="off">
  </div>
  <div class="field body-field">
    <label for="body">Anything else (keep it short)</label>
    <textarea id="body" placeholder="if you need more than a few lines, maybe it couldn't have been an email"></textarea>
  </div>
  <div class="actions">
    <span class="char-count" id="charCount"></span>
    <button type="submit">Send this instead</button>
  </div>
</form>

<footer>
  <p class="tagline" id="tagline">The meeting could have been an email. It still can be.</p>
  <p class="note">Opens your email client. Nothing is stored here.</p>
</footer>

<script>
var form = document.getElementById('emailForm');
var charCount = document.getElementById('charCount');
var toggle = document.getElementById('themeToggle');
var submitBtn = document.querySelector('button[type="submit"]');
var tagline = document.getElementById('tagline');

// theme
function setTheme(dark, animate) {
  if (animate === false) {
    document.documentElement.style.transition = 'none';
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.documentElement.offsetHeight; // force reflow
    document.documentElement.style.transition = '';
  } else {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }
  toggle.textContent = dark ? 'light' : 'dark';
  localStorage.setItem('theme', dark ? 'dark' : 'light');
}

var saved = localStorage.getItem('theme');
var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
setTheme(saved ? saved === 'dark' : prefersDark, false);

toggle.addEventListener('click', function() {
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  setTheme(!isDark, true);
});

// readiness + char count
function updateForm() {
  var total = ['subject', 'decided', 'action', 'by', 'body']
    .reduce(function(n, id) { return n + document.getElementById(id).value.length; }, 0);
  if (total > 0) {
    charCount.textContent = total + ' chars';
    charCount.style.color = total > 500 ? 'var(--red)' : '';
  } else {
    charCount.textContent = '';
  }

  var hasTo = document.getElementById('to').value.trim().length > 0;
  var hasSubject = document.getElementById('subject').value.trim().length > 0;
  var hasContent = ['decided', 'action', 'by', 'body'].some(function(id) {
    return document.getElementById(id).value.trim().length > 0;
  });

  if (hasTo && hasSubject && hasContent) {
    submitBtn.classList.add('ready');
  } else {
    submitBtn.classList.remove('ready');
  }
}

['to', 'subject', 'decided', 'action', 'by', 'body'].forEach(function(id) {
  document.getElementById(id).addEventListener('input', updateForm);
});

// submit
form.addEventListener('submit', function(e) {
  e.preventDefault();
  if (!submitBtn.classList.contains('ready')) return;

  var to = document.getElementById('to').value.trim();
  var subject = document.getElementById('subject').value.trim();
  var decided = document.getElementById('decided').value.trim();
  var action = document.getElementById('action').value.trim();
  var by = document.getElementById('by').value.trim();
  var extra = document.getElementById('body').value.trim();

  var lines = [];
  if (decided) lines.push('Decision: ' + decided);
  if (action) lines.push('Next step: ' + action);
  if (by) lines.push('By: ' + by);
  if (extra) {
    lines.push('');
    lines.push(extra);
  }

  var body = lines.join('\n');
  var mailto = 'mailto:' + encodeURIComponent(to)
    + '?subject=' + encodeURIComponent(subject)
    + '&body=' + encodeURIComponent(body);

  tagline.textContent = 'The meeting became an email.';
  tagline.classList.add('sent');
  window.location.href = mailto;
});
</script>
</body>
</html>
