<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This meeting could have been an email.</title>
<meta name="description" content="It still can be.">
<meta property="og:title" content="This meeting could have been an email.">
<meta property="og:description" content="It still can be.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://meetingcouldhavebeenan.email">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="This meeting could have been an email.">
<meta name="twitter:description" content="It still can be.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'%3E%3Ccircle cx='5' cy='8' r='1.4' fill='%23171b21'/%3E%3C/svg%3E">
<link rel="stylesheet" href="tokens.css?5">
<style>
:root{--red:var(--amber-base);--quiet:var(--longquan-base)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--quiet:oklch(.621 var(--ding))}}
:root[data-theme="dark"]{--quiet:oklch(.621 var(--ding))}
body{margin:0;padding:3rem 16px 1.4rem;min-height:100svh;box-sizing:border-box;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:19px/1.5 var(--sans);font-variant-numeric:oldstyle-nums}
main,.by{width:100%;max-width:36rem;margin:0 auto}
main{flex:1}
header{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:2rem}
h1{margin:0;font-size:1.6rem;font-weight:400;line-height:1.3}
button,input,textarea{font:inherit;color:inherit;background:none;border:0;padding:0}
button{color:var(--quiet);cursor:pointer}
button:focus-visible{outline:1px solid var(--rule);outline-offset:4px}
.theme-toggle{font-size:.95rem}
.theme-toggle:hover{color:var(--ink)}
form{border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.field{display:flex;align-items:baseline;border-bottom:1px solid var(--rule)}
label{width:6.5rem;flex-shrink:0;padding:1rem 1.1rem;font-size:1.1rem;color:var(--quiet);font-variant-caps:all-small-caps;letter-spacing:.04em}
input,textarea{flex:1;min-width:0;padding:1rem 1.1rem;font-size:1.15rem;line-height:1.5;color:var(--ink);outline:0;resize:none}
input:focus,textarea:focus{box-shadow:inset 3px 0 0 var(--longquan-base)}
::placeholder{color:var(--quiet);opacity:1}
.body-field{display:block;border:0}
.body-field label{display:block;width:auto;padding-bottom:0}
textarea{display:block;width:100%;box-sizing:border-box;min-height:7rem}
.actions{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 1.1rem;border-top:1px solid var(--rule)}
.char-count{font-size:.9rem;color:var(--quiet);font-variant-numeric:lining-nums tabular-nums}
button[type=submit]{padding:.7rem 2.2rem;font-size:1.1rem;border-radius:5px;box-shadow:inset 0 0 0 1px var(--rule);cursor:default}
button[type=submit].ready{background:var(--longquan-accent);color:var(--paper);box-shadow:none;cursor:pointer}
button[type=submit].ready:active{transform:scale(.97)}
footer{margin-top:2rem}
.tagline{margin:0;font-size:1.15rem}
.tagline.sent{color:var(--longquan-accent)}
a{color:var(--longquan-accent);text-underline-offset:.15em}
.by{margin-top:3rem;text-align:right;font-size:.8rem;font-family:var(--book)}
@media (max-width:480px){
header{margin-bottom:1.5rem}
label{width:5.5rem;padding:.8rem;font-size:1rem}
input,textarea{padding:.8rem;font-size:1.05rem}
.actions{padding:.8rem}
footer{margin-top:1.5rem}
}
</style>
</head>
<body>
<main>

<header>
  <h1>This meeting could have been an email.</h1>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">dark</button>
</header>

<form class="email-form" id="emailForm">
  <div class="field">
    <label for="to">To</label>
    <input type="text" id="to" placeholder="who needs to know" autocomplete="off">
  </div>
  <div class="field">
    <label for="subject">Subject</label>
    <input type="text" id="subject" placeholder="what this is about" autocomplete="off">
  </div>
  <div class="field">
    <label for="decided">Decided</label>
    <input type="text" id="decided" placeholder="what was decided" autocomplete="off">
  </div>
  <div class="field">
    <label for="action">Next step</label>
    <input type="text" id="action" placeholder="what needs to happen now" autocomplete="off">
  </div>
  <div class="field">
    <label for="by">By when</label>
    <input type="text" id="by" placeholder="deadline, if any" autocomplete="off">
  </div>
  <div class="field body-field">
    <label for="body">Anything else (keep it short)</label>
    <textarea id="body" placeholder="if you need more than a few lines, maybe it couldn&rsquo;t have been an email"></textarea>
  </div>
  <div class="actions">
    <span class="char-count" id="charCount"></span>
    <button type="submit">Send this instead</button>
  </div>
</form>

<footer>
  <p class="tagline" id="tagline">It still can be.</p>
</footer>

</main>
<p class="by">by <a href="https://github.com/bonchicbongenre/email">bonchicbongenre</a></p>

<script>
var form = document.getElementById('emailForm');
var charCount = document.getElementById('charCount');
var toggle = document.getElementById('themeToggle');
var submitBtn = document.querySelector('button[type="submit"]');
var tagline = document.getElementById('tagline');

// theme: the system's, until the visitor turns it; nothing is kept
var root = document.documentElement;
var system = window.matchMedia('(prefers-color-scheme: dark)');
function isDark() {
  var t = root.getAttribute('data-theme');
  return t ? t === 'dark' : system.matches;
}
toggle.textContent = isDark() ? 'light' : 'dark';
system.addEventListener('change', function() {
  if (!root.getAttribute('data-theme')) toggle.textContent = isDark() ? 'light' : 'dark';
});
toggle.addEventListener('click', function() {
  var dark = !isDark();
  root.setAttribute('data-theme', dark ? 'dark' : 'light');
  toggle.textContent = dark ? 'light' : 'dark';
});

// readiness + char count
function updateForm() {
  var total = ['subject', 'decided', 'action', 'by', 'body']
    .reduce(function(n, id) { return n + document.getElementById(id).value.length; }, 0);
  if (total > 0) {
    charCount.textContent = total + ' chars';
    charCount.style.color = total > 500 ? 'var(--red)' : '';
  } else {
    charCount.textContent = '';
  }

  var hasTo = document.getElementById('to').value.trim().length > 0;
  var hasSubject = document.getElementById('subject').value.trim().length > 0;
  var hasContent = ['decided', 'action', 'by', 'body'].some(function(id) {
    return document.getElementById(id).value.trim().length > 0;
  });

  if (hasTo && hasSubject && hasContent) {
    submitBtn.classList.add('ready');
  } else {
    submitBtn.classList.remove('ready');
  }
}

['to', 'subject', 'decided', 'action', 'by', 'body'].forEach(function(id) {
  document.getElementById(id).addEventListener('input', updateForm);
});

// submit
form.addEventListener('submit', function(e) {
  e.preventDefault();
  if (!submitBtn.classList.contains('ready')) return;

  var to = document.getElementById('to').value.trim();
  var subject = document.getElementById('subject').value.trim();
  var decided = document.getElementById('decided').value.trim();
  var action = document.getElementById('action').value.trim();
  var by = document.getElementById('by').value.trim();
  var extra = document.getElementById('body').value.trim();

  var lines = [];
  if (decided) lines.push('Decision: ' + decided);
  if (action) lines.push('Next step: ' + action);
  if (by) lines.push('By: ' + by);
  if (extra) {
    lines.push('');
    lines.push(extra);
  }

  var body = lines.join('\n');
  var mailto = 'mailto:' + encodeURIComponent(to)
    + '?subject=' + encodeURIComponent(subject)
    + '&body=' + encodeURIComponent(body);

  tagline.textContent = 'The meeting became an email.';
  tagline.classList.add('sent');
  window.location.href = mailto;
});
</script>
</body>
</html>
